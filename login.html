<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión o crea tu cuenta en Veloce Bikes. Recuperación de contraseña con código de 6 dígitos.">
  <title>Ingresar | Veloce Bikes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <span class="logo__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
            <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>
          </svg>
        </span>
        <span>Veloce</span>
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Inicio</a></li>
          <li><a href="catalogo.html" class="nav__link">Catálogo</a></li>
          <li><a href="accesorios.html" class="nav__link">Accesorios</a></li>
          <li><a href="mantenimiento.html" class="nav__link">Mantenimiento</a></li>
          <li>
            <a href="carrito.html" class="cart-icon" aria-label="Ver carrito">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              <span class="cart-count" id="cart-count">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="auth-card">
          <div style="display:flex;gap:8px;margin-bottom:24px;">
            <button type="button" class="btn" id="tab-login" style="flex:1;" onclick="mostrarVista('login')">Iniciar sesión</button>
            <button type="button" class="btn btn--ghost" id="tab-reg" style="flex:1;" onclick="mostrarVista('registro')">Crear cuenta</button>
          </div>

          <!-- LOGIN -->
          <form id="vista-login" onsubmit="submitLogin(event)">
            <div class="form-group">
              <label for="login-email">Correo electrónico</label>
              <input type="email" id="login-email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
              <label for="login-pass">Contraseña</label>
              <input type="password" id="login-pass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn--lg btn--full">Ingresar</button>
            <p style="text-align:center;margin-top:14px;font-size:.88rem;">
              <button type="button" class="link-guide" onclick="mostrarVista('recuperar')">¿Olvidaste tu contraseña? Recupérala aquí</button>
            </p>
          </form>

          <!-- REGISTRO -->
          <form id="vista-registro" hidden onsubmit="submitRegister(event)">
            <div class="form-group">
              <label for="reg-nombre">Nombre completo</label>
              <input type="text" id="reg-nombre" required placeholder="Tu nombre y apellido">
            </div>
            <div class="form-group">
              <label for="reg-email">Correo electrónico</label>
              <input type="email" id="reg-email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
              <label for="reg-pass">Contraseña (mínimo 8 caracteres, letra y número)</label>
              <input type="password" id="reg-pass" required minlength="8" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn--lg btn--full">Crear cuenta</button>
          </form>

          <!-- RECUPERAR -->
          <form id="vista-recuperar" hidden onsubmit="submitReset(event)">
            <div class="form-group">
              <label for="rec-email">Correo electrónico</label>
              <input type="email" id="rec-email" required placeholder="tu@email.com">
            </div>
            <button type="button" class="btn btn--ghost btn--full" onclick="pedirCodigo()">Enviar código</button>
            <div id="rec-paso2" hidden style="margin-top:16px;">
              <div class="form-group">
                <label for="rec-code">Código de 6 dígitos</label>
                <input type="text" id="rec-code" maxlength="6" placeholder="123456">
              </div>
              <div class="form-group">
                <label for="rec-pass">Nueva contraseña</label>
                <input type="password" id="rec-pass" required minlength="8" placeholder="••••••••">
              </div>
              <button type="submit" class="btn btn--lg btn--full">Restablecer contraseña</button>
            </div>
            <p style="text-align:center;margin-top:14px;font-size:.88rem;">
              <button type="button" class="link-guide" onclick="mostrarVista('login')">← Volver a iniciar sesión</button>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <p>© 2026 Veloce Bikes — Proyecto formativo SENA.</p>
        <p>Hecho con HTML, CSS y JS puros · Cero dependencias</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function mostrarVista(v){
      ["login","registro","recuperar"].forEach(x => {
        document.getElementById("vista-" + x).hidden = (x !== v);
      });
      document.getElementById("tab-login").className = (v === "login") ? "btn" : "btn btn--ghost";
      document.getElementById("tab-reg").className = (v === "registro") ? "btn" : "btn btn--ghost";
      if (v === "login") document.getElementById("tab-login").style.flex = "1";
      if (v === "registro") document.getElementById("tab-reg").style.flex = "1";
    }

    async function submitLogin(e){
      e.preventDefault();
      const err = await iniciarSesion(document.getElementById("login-email").value.trim(), document.getElementById("login-pass").value);
      if (err){ alert(err); return; }
      location.href = "index.html";
    }

    async function submitRegister(e){
      e.preventDefault();
      const err = await registrarUsuario(
        document.getElementById("reg-nombre").value.trim(),
        document.getElementById("reg-email").value.trim(),
        document.getElementById("reg-pass").value
      );
      if (err){ alert(err); return; }
      alert("✅ Cuenta creada correctamente. ¡Bienvenido a Veloce Bikes!");
      location.href = "index.html";
    }

    function pedirCodigo(){
      const email = document.getElementById("rec-email").value.trim();
      const err = solicitarRecuperacion(email);
      if (err){ alert(err); return; }
      document.getElementById("rec-paso2").hidden = false;
    }

    async function submitReset(e){
      e.preventDefault();
      const err = await restablecerContrasena(
        document.getElementById("rec-email").value.trim(),
        document.getElementById("rec-code").value.trim(),
        document.getElementById("rec-pass").value
      );
      if (err){ alert(err); return; }
      alert("✅ Contraseña restablecida. Ya puedes iniciar sesión.");
      mostrarVista("login");
    }

    document.addEventListener("DOMContentLoaded", () => mostrarVista("login"));
  </script>
</body>
</html>
