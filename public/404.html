<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Veloce Bikes</title>
<script>
// Redirección para GitHub Pages (SPA con BrowserRouter): conserva la ruta pedida.
var base = location.pathname.split('/').slice(0, 2).join('/') || '';

location.replace(base + '/');
</script></head><body></body></html>
